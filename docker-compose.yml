version: '3.8'

services:
  # --- DATABASE ---
  db:
    image: postgres:16-alpine
    container_name: morfolog-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: morfolog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- AI ENGINE (PYTHON) ---
  ai-engine:
    build: 
      context: ./engine-python
      dockerfile: Dockerfile
    container_name: morfolog-ai
    ports:
      - "8000:8000"
    # Assuming .env is in engine-python folder based on file listing
    env_file:
      - ./engine-python/.env  
    environment:
      # We mount the key directly from the engine-python folder where it currently resides
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_key.json
    volumes:
      # Mounting the key from engine-python/gcp_key.json to /app/gcp_key.json in container
      # This matches the working directory in Dockerfile (/app)
      - ./engine-python/gcp_key.json:/app/gcp_key.json:ro

  # --- BACKEND (.NET) ---
  backend:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: morfolog-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ai-engine
    environment:
      # Connection string uses service name "db" instead of "localhost"
      - ConnectionStrings__DefaultConnection=Host=db;Database=morfolog;Username=postgres;Password=admin
      # AI Service address is "http://service-name:port"
      - AiServiceUrl=http://ai-engine:8000
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  postgres_data:
